<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funny Question</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e9e9ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #0002;
            width: 300px;
        }

        h2 {
            color: #333;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
        }

        #yes {
            background: #28a745;
            color: white;
        }

        #no {
            background: #dc3545;
            color: white;
        }

        #message {
            color: #28a745;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2 id="question">
            Hey Lissah , do you miss me? 😀 🤔
        </h2>

        <p id="message"></p>

        <button id="yes" onclick="sayYes()">YES</button>

        <button id="no" onmouseenter="runAway()">NO</button>

    </div>

    <script>

        function runAway() {

            const button = document.getElementById("no");

            // Generate random screen coordinates
            const maxX = window.innerWidth - button.offsetWidth;
            const maxY = window.innerHeight - button.offsetHeight;

            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;

            // Move button to random position
            button.style.position = "fixed";
            button.style.left = randomX + "px";
            button.style.top = randomY + "px";
        }

        function sayYes() {

            document.getElementById("question").innerHTML =
                "THANKS 🥳😘  I miss you too";

            document.getElementById("message").innerHTML =
                "You made the right choice!";

            document.getElementById("yes").style.display = "none";
            document.getElementById("no").style.display = "none";
        }

    </script>

</body>
</html>
